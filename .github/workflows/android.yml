name: Android CI

on:
  push:
    branches: ['main', 'master', 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Mango center cross-reference audit
        run: python3 Tools/tests/check_mango_center.py
      - name: Main tabs customization tests
        run: python3 Tools/tests/run_main_tabs_customization_tests.py

  build:
    name: Build afatRelease APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 cannot be used: it installs a default
      # "tools" package that no longer exists in the SDK repository, so the step
      # dies with "Failed to find package 'tools'". Locate (or bootstrap) the
      # command line tools ourselves instead of relying on PATH.
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No cmdline-tools on the runner, bootstrapping them."
            curl -sSLo /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-tools && unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            cp -r /tmp/cmdline-tools/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;21.4.7075529" "cmake;3.10.2"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          ls "$SDK_ROOT/ndk"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'TMessagesProj/build.gradle', 'TMessagesProj_App/build.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build afatRelease APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease -x lintVitalRelease --console=plain --no-daemon
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mango-afatRelease-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
